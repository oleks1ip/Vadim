<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Moments Album</title>
    <link rel="stylesheet" href="style_album.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="album-page">
    <div class="flowers-container">
        <img src="img/flowers/25.svg" class="flower flower-1" alt="Flower 1">
        <img src="img/flowers/26.svg" class="flower flower-2" alt="Flower 2">
        <img src="img/flowers/27.svg" class="flower flower-3" alt="Flower 3">
        <img src="img/flowers/28.svg" class="flower flower-4" alt="Flower 4">
        <img src="img/flowers/29.svg" class="flower flower-5" alt="Flower 5">
        <img src="img/flowers/30.svg" class="flower flower-6" alt="Flower 6">
        <img src="img/flowers/1.svg" class="flower flower-7" alt="Flower 7">
        <img src="img/flowers/2.svg" class="flower flower-8" alt="Flower 8">
        <img src="img/flowers/3.svg" class="flower flower-9" alt="Flower 9">
        <img src="img/flowers/4.svg" class="flower flower-10" alt="Flower 10">
        <img src="img/flowers/5.svg" class="flower flower-11" alt="Flower 11">
        <img src="img/flowers/6.svg" class="flower flower-12" alt="Flower 12">
    </div>

    <header class="album-header">
        <h1>Happy Moments</h1>
        <p>Наші найкращі спогади разом ❤️</p>
    </header>

    <main class="gallery-container">
        <div class="polaroid"><img src="img/photo/1.jpg" alt="Moment 1"></div>
        <div class="polaroid"><img src="img/photo/2.jpg" alt="Moment 2"></div>
        <div class="polaroid"><img src="img/photo/3.jpg" alt="Moment 3"></div>
        <div class="polaroid"><img src="img/photo/4.jpg" alt="Moment 4"></div>
        <div class="polaroid"><img src="img/photo/5.jpg" alt="Moment 5"></div>
        <div class="polaroid"><img src="img/photo/6.jpg" alt="Moment 6"></div>
        <div class="polaroid"><img src="img/photo/7.jpg" alt="Moment 7"></div>
        <div class="polaroid"><img src="img/photo/8.jpg" alt="Moment 8"></div>
        <div class="polaroid"><img src="img/photo/9.jpg" alt="Moment 9"></div>
        <div class="polaroid"><img src="img/photo/10.jpg" alt="Moment 10"></div>
    </main>
</body>
</html>
